include Gruvbox Material Dark Medium.conf

# text
font_family family="Ioskeley Mono Term"
font_size 13
modify_font cell_height 115%

# cursor
cursor_blink_interval 0
cursor_trail 1
custom_shaders cursor-trail-motion-blur

# window
macos_show_window_title_in window
macos_titlebar_color background
placement_strategy center
padding_fill_strategy neighboring_cell

